<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小程序后端</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 40px 20px;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 12px;
        }
        p {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }
        .hint {
            margin-top: 24px;
            padding: 12px 16px;
            background: #fff;
            border-radius: 8px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📋</div>
        <h1>小程序后端</h1>
        <p>请在微信客户端内打开此小程序</p>
        <div class="hint">长按识别小程序码即可进入</div>
    </div>
</body>
</html>
