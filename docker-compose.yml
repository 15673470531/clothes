services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clothes-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/pool.conf:/usr/local/etc/php-fpm.d/zz-pool.conf
      # 图片上传限制（upload_max_filesize 等）：PHP 默认 2M，手机照片会被拒
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini
    networks:
      - clothes-network
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=172.17.0.1
      - DB_PORT=3306
      - DB_DATABASE=clothes
      - DB_USERNAME=clothes
      - DB_PASSWORD=clothes_pass

  # 队列 worker（2026-09 加 · AI 试穿）
  # 项目里第一个用到队列的功能：AI 试穿生成要 20~35 秒，不能卡在小程序请求里，
  # 所以提交后进队列、由这个 worker 处理（数据库驱动，jobs 表已存在）。
  # ⚠️ 这个容器不跑的话，试穿任务会一直停在 pending（页面一直转圈）。
  # 代码与 app 共用同一份卷，改了 PHP 代码要重启它：docker compose restart worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clothes-worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --timeout=300 --sleep=2
    volumes:
      - .:/var/www/html
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini
    networks:
      - clothes-network
    depends_on:
      - app
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=172.17.0.1
      - DB_PORT=3306
      - DB_DATABASE=clothes
      - DB_USERNAME=clothes
      - DB_PASSWORD=clothes_pass

  nginx:
    image: nginx:alpine
    container_name: clothes-nginx
    restart: unless-stopped
    ports:
      - "8090:80"
      - "9443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/ssl:/etc/nginx/ssl
    networks:
      - clothes-network
    depends_on:
      - app
  adminer:
    image: adminer
    restart: always
    ports:
      - 18090:8080
    networks:
      - clothes-network

networks:
  clothes-network:
    driver: bridge
